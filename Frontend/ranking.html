<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.css" />
  <title>SaoLaEdu</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="style2.css" />
  <link rel="stylesheet" href="style3.css" />
</head>

<body>
  <header id="header">
    <div id="header-inner">
      <section class="right">
        <a href="index.html" id="logo">
          <img src="img/logo.webp" alt="Logo" />
          <span>SaoLa<span id="logo-span">Edu</span></span>
        </a>
      </section>
      <button id="menu-btn" aria-label="Mở menu" aria-expanded="false">
        ☰
      </button>

      <ul id="nav" class="center">
        <li id="nav-gioi-thieu">
          <a href="index.html" id="link-gioi-thieu" title="Giới thiệu" aria-label="Giới thiệu">
            <i class="fa-solid fa-house"></i><span class="nav-chu">Giới thiệu</span>
          </a>
        </li>
        <li id="nav-bai-tap">
          <a href="subjects.html" id="link-bai-tap" title="Bài tập" aria-label="Bài tập">
            <i class="fa-solid fa-book-open"></i><span class="nav-chu">Bài tập</span>
          </a>
        </li>
        <li id="nav-cuoc-thi">
          <a href="contest.html" id="link-cuoc-thi" title="Tranh tài" aria-label="Tranh tài">
            <i class="fa-solid fa-trophy"></i><span class="nav-chu">Tranh tài</span>
          </a>
        </li>
        <li id="nav-xep-hang">
          <a href="ranking.html" id="link-xep-hang" title="Xếp hạng" aria-label="Xếp hạng">
            <i class="fa-solid fa-ranking-star"></i><span class="nav-chu">Xếp hạng</span>
          </a>
        </li>
      </ul>

      <div class="user-account-area">
        <div id="auth-buttons">
          <a href="login.html" class="auth-link">Đăng nhập</a>
          <a href="register.html" class="auth-link">Đăng ký</a>
        </div>
        <!-- 2. Khi đã đăng nhập (mặc định thêm class hidden) -->
        <div id="user-profile" class="hidden">
          <div class="streak-box">🔥 <span>0</span></div>
          <span class="username">Username</span>
          <img src="img/avartar.webp" alt="Avatar" class="user-avatar" />
        </div>
      </div>
    </div>
  </header>

  <div class="leaderboard-container">
    <!-- Phần Bục Tuyên Dương (Podium) -->
    <!-- Bục tuyên dương: ranking.js sẽ điền tên và điểm vào -->
    <div class="podium-section">
      <!-- Hạng 2 (bạc) nằm bên trái -->
      <div class="podium-card silver" id="podium-2">
        <img class="avatar" src="img/avartar.webp" alt="Avatar Top 2">
        <span class="podium-name"></span>
        <div class="step">2</div>
      </div>

      <!-- Hạng 1 (vàng, cao nhất) nằm giữa -->
      <div class="podium-card gold" id="podium-1">
        <img class="avatar" src="img/avartar.webp" alt="Avatar Top 1">
        <span class="podium-name"></span>
        <div class="step">1</div>
      </div>

      <!-- Hạng 3 (đồng) nằm bên phải -->
      <div class="podium-card bronze" id="podium-3">
        <img class="avatar" src="img/avartar.webp" alt="Avatar Top 3">
        <span class="podium-name"></span>
        <div class="step">3</div>
      </div>
    </div>

    <!-- Phần Bảng Người Dùng (Màu xanh) -->
    <div class="table-section">
      <table class="user-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Bio</th>
            <th>Username</th>
            <th>Điểm</th>
          </tr>
        </thead>
        <tbody id="ranking-list">
        </tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="ranking.js"></script>
</body>

</html>
