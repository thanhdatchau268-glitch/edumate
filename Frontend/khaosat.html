<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.css" />
  <title>EduMate</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="style2.css" />
  <link rel="stylesheet" href="style3.css" />
</head>

<body>
  <header id="header">
    <div id="header-inner">
      <section class="right">
        <a href="index.html" id="logo">
          <img src="img/logo.webp" alt="Logo" />
          <span>Edu<span id="logo-span">Mate</span></span>
        </a>
      </section>
    </div>
  </header>

  <div id="survey">
    <form id="input-survey">
      <h2 class="form-muc">1. Điểm số của bạn</h2>
      <p class="form-ghi-chu">
        Nhập điểm theo từng kỳ thi. Kỳ nào chưa tới ngày thì chưa nhập được.
        Nhập càng nhiều kỳ, dự đoán càng sát.
      </p>

      <input type="checkbox" id="survey-3-specialized_high_school">
      <label for="survey-3-specialized_high_school">Bạn có nhu cầu thi chuyên không?</label>

      <!-- Chỉ hiện khi tick thi chuyên -->
      <div id="chuyen-section" hidden>
        <label for="mon-chuyen">Môn chuyên đăng ký:</label>
        <select id="mon-chuyen" name="mon_chuyen">
          <option value="">-- Chọn môn chuyên --</option>
          <option value="toan">Chuyên Toán</option>
          <option value="ly">Chuyên Vật Lý</option>
          <option value="hoa">Chuyên Hóa Học</option>
        </select>

        <div class="chk">
          <input type="checkbox" id="chuyen-xa">
          <label for="chuyen-xa">
            Mình chấp nhận học chuyên ở trường xa (ở ký túc xá / ở trọ) nếu dễ đỗ hơn
          </label>
        </div>
      </div>

      <!-- JS tự vẽ bảng điểm các kỳ thi vào đây -->
      <div id="ky-thi" class="ky-thi"></div>

      <h2 class="form-muc">2. Mong muốn của bạn</h2>

      <label for="uu-tien">Bạn ưu tiên điều gì nhất?</label>
      <select id="uu-tien">
        <option value="gan">Gần nhà</option>
        <option value="chatluong">Chất lượng (điểm chuẩn cao)</option>
        <option value="antoan">Chắc đỗ (an toàn)</option>
      </select>

      <label for="phuong-tien">Phương tiện đi học:</label>
      <select id="phuong-tien">
        <option value="xedap">Xe đạp</option>
        <option value="xemay" selected>Xe máy</option>
        <option value="xebuyt">Xe buýt</option>
      </select>

      <input type="checkbox" id="survey-4-dorm">
      <label for="survey-4-dorm">Mình có thể ở ký túc xá / ở trọ gần trường</label>

      <button type="submit">Nộp</button>
      <button type="reset">Xóa tất cả</button>
    </form>
  </div>

  <script src="khaosat.js"></script>
  <script src="script.js"></script>
</body>

</html>
