        <li id="nav-bai-tap">

        </li>
        <li id="nav-khoa-bang">

            <i class="fa-solid fa-scroll"></i><span class="nav-chu">Khoa cử</span>
          </a>
        </li>
        <li id="nav-xep-hang">
          <a href="ranking.html" id="link-xep-hang" title="Xếp hạng" aria-label="Xếp hạng">

        </div>
        <div id="user-profile" class="hidden">
          <div class="streak-box"><img src="img/icon-streak.png" alt="Streak" class="vn-ico vn-ico-streak" /><span>0</span></div>

          <img src="img/avartar.webp" alt="Avatar" class="user-avatar" />

      <p>
